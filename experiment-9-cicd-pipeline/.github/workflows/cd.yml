name: CD Pipeline - Containerization & Canary Deployment

# Continuous Deployment triggers upon successful main push or manual release dispatch
on:
  workflow_run:
    workflows: ["CI Pipeline - Automated Build & Testing"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      canary_traffic_percentage:
        description: 'Initial Canary traffic percentage (e.g., 10, 25)'
        required: true
        default: '10'

jobs:
  docker-build-and-deploy:
    name: Build Docker Image & Deploy Canary Release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub using secure secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 4: Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/experiment-9-app:v2.0.0,${{ secrets.DOCKER_HUB_USERNAME }}/experiment-9-app:latest

      # Step 5: Canary Deployment with initial 10% traffic split
      - name: Deploy Canary Release
        env:
          INITIAL_PERCENTAGE: ${{ github.event.inputs.canary_traffic_percentage || '10' }}
        run: |
          echo "Deploying Canary release v2.0.0 alongside Stable v1.0.0..."
          echo "Configuring reverse proxy / ingress controller with ${INITIAL_PERCENTAGE}% traffic directed to Canary."
          echo "Initiating automated health monitoring probes..."
